    <script>
      document.documentElement.classList.add('animate');
      document.addEventListener('DOMContentLoaded', function(){
        document.querySelectorAll('.stagger').forEach(function(parent){
          parent.querySelectorAll('.reveal').forEach(function(el, idx){
            var base = parseInt(getComputedStyle(el).getPropertyValue('--d')) || 0;
            el.style.setProperty('--d', (base + idx*60) + 'ms');
          });
        });
      });
    </script>
